<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.ico?v=3" sizes="any">
  <title>관리자 - 키라라 판타지아 카드게임</title>
  <link rel="stylesheet" href="css/style.css?v=w14">
  <style>
    body.theme-kirafan { color: #f2f2f2; }
    .admin-page {
      position: relative; z-index: 1;
      max-width: 920px; margin: 24px auto; padding: 20px 22px 40px;
      background: rgba(18, 14, 28, 0.92);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .admin-page h1, .admin-page h2 { margin: 0 0 8px; color: #fff; }
    .admin-page h1 { font-size: 1.35rem; }
    .admin-page h2 { font-size: 1.05rem; margin-top: 8px; }
    .admin-meta { color: #c8c4d4; font-size: 0.9rem; margin-bottom: 18px; }
    .admin-page .back-link { color: #e8e4f4; }
    .admin-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0 28px; }
    @media (max-width: 900px) {
      .admin-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .admin-stat { padding: 14px 12px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.16); border-radius: 4px; }
    .admin-stat .label { display: block; font-size: 0.8rem; color: #c8c4d4; margin-bottom: 6px; }
    .admin-stat .value { font-size: 1.6rem; font-variant-numeric: tabular-nums; color: #fff; }
    .admin-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .admin-list { list-style: none; margin: 0; padding: 0; }
    .admin-list li {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .admin-list .sub { color: #b8b4c4; font-size: 0.85rem; }
    .admin-gate, .admin-error { padding: 16px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.14); border-radius: 4px; }
    .admin-error { color: #f0a0a0; }
    #admin-empty { color: #c8c4d4; }
    @media (max-width: 640px) {
      .admin-stats { grid-template-columns: 1fr; }
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="theme-kirafan">
  <div id="background" aria-hidden="true"></div>
  <main class="admin-page panel">
    <header>
      <a class="back-link" href="index.html">← 메뉴</a>
      <h1>관리자</h1>
      <p class="admin-meta" id="admin-user">구글 로그인 필요 · 허용된 계정만 접근</p>
    </header>

    <div id="admin-gate" class="admin-gate">
      <p>접속 집계와 보관 리플레이는 관리자만 볼 수 있습니다.</p>
      <div class="admin-actions">
        <button type="button" class="menu-button" id="admin-login">구글 로그인</button>
      </div>
      <p id="admin-gate-error" class="admin-error" hidden></p>
    </div>

    <div id="admin-panel" hidden>
      <section>
        <h2>접속 (같은 IP · 24시간 = 1회 · 동접도 IP당 1명)</h2>
        <div class="admin-stats">
          <div class="admin-stat"><span class="label">실시간 동접</span><span class="value" id="stat-concurrent">-</span></div>
          <div class="admin-stat"><span class="label">최근 24시간</span><span class="value" id="stat-24h">-</span></div>
          <div class="admin-stat"><span class="label">최근 7일</span><span class="value" id="stat-7d">-</span></div>
          <div class="admin-stat"><span class="label">누적 고유</span><span class="value" id="stat-total">-</span></div>
        </div>
      </section>

      <section>
        <h2>보관 리플레이 (서버·AI)</h2>
        <div class="admin-actions">
          <button type="button" class="menu-button small" id="admin-refresh">새로고침</button>
          <button type="button" class="menu-button small" id="admin-logout">로그아웃</button>
        </div>
        <ul id="admin-replays" class="admin-list"></ul>
        <p id="admin-empty" class="records-empty" hidden>보관된 리플레이가 없습니다.</p>
        <p id="admin-error" class="admin-error" hidden></p>
      </section>
    </div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/admin.js?v=2"></script>
  <script type="module" src="js/presence.js?v=1"></script>
</body>
</html>
