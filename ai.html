<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/favicon.png?v=3">
  <title data-i18n="ai.title">AI 대전 - 키라라 판타지아 카드게임</title>
  <link rel="stylesheet" href="css/style.css?v=w26">
  <link rel="stylesheet" href="css/deck.css?v=46">
  <link rel="stylesheet" href="css/ai.css?v=w15">
  <style>.fhd-stage{visibility:hidden}.fhd-stage.is-fitted{visibility:visible}</style>
</head>
<body class="window-theme window-theme-fill">
  <div id="background" aria-hidden="true"></div>

  <div class="fhd-shell">
  <div class="fhd-stage">
  <div class="ai-page">
    <!-- left: the card under the pointer -->
    <section class="side">
      <img id="preview" class="preview" alt="" src="">
      <div class="tabs">
        <button type="button" class="tab active" data-tab="info" data-i18n="common.cardInfo">카드 정보</button>
        <button type="button" class="tab" data-tab="settings" data-i18n="game.settings">설정</button>
        <span class="text-size">
          <button class="size-button" id="text-smaller" data-i18n="common.textSizeMinus" data-i18n-title="common.textSmaller" title="글자 작게">가-</button>
          <span id="text-size-value"></span>
          <button class="size-button" id="text-bigger" data-i18n="common.textSizePlus" data-i18n-title="common.textBigger" title="글자 크게">가+</button>
        </span>
      </div>
      <div class="tab-page card-info panel" id="card-info" data-page="info"></div>
      <div class="tab-page panel settings" data-page="settings" hidden>
        <p data-i18n="game.sound">사운드</p>
        <label class="volume">
          <span data-i18n="common.sfx">효과음</span>
          <input type="range" id="volume-voice" min="0" max="100" step="5">
          <b id="volume-voice-value"></b>
        </label>
        <label class="volume">
          <span data-i18n="common.bgm">배경음</span>
          <input type="range" id="volume-bgm" min="0" max="100" step="5">
          <b id="volume-bgm-value"></b>
        </label>
        <p data-i18n="common.language">언어 설정</p>
        <label class="volume settings-lang">
          <select class="field" id="settings-lang" data-i18n-aria="common.language" aria-label="언어 설정">
            <option value="ko" data-i18n="lang.ko">한국어</option>
            <option value="ja" data-i18n="lang.ja">日本語</option>
            <option value="en" data-i18n="lang.en">English</option>
          </select>
        </label>
      </div>
    </section>

    <!-- right: 1. the opponent (level, deck), 2. the player's deck -->
    <section class="ai-main panel">
      <header class="steps">
        <span class="step" data-step="1" data-i18n="ai.step1">1. 상대 고르기</span>
        <span class="step-arrow">›</span>
        <span class="step" data-step="2" data-i18n="ai.step2">2. 내 덱 고르기</span>
      </header>

      <div class="step-body" id="step-1">
        <div class="section-row">
          <h2 class="section-title" data-i18n="ai.level">AI 난이도</h2>
          <span class="level-desc" id="level-desc"></span>
        </div>
        <div class="level-choices" id="level-choices"></div>
        <div class="section-row ai-deck-head">
          <h2 class="section-title" data-i18n="ai.deck">AI 덱</h2>
          <div class="deck-source-tabs" id="deck-source-tabs" role="tablist"></div>
        </div>
        <div class="deck-choices" id="ai-deck-choices"></div>
        <p id="opp-deck-note" class="opp-deck-note" hidden></p>
      </div>

      <div class="step-body" id="step-2" hidden>
        <p class="opponent" id="opponent"></p>
        <h2 class="section-title" data-i18n="ai.myDeck">내 덱</h2>
        <div class="my-deck-row">
          <select id="my-deck" class="field"></select>
          <span id="my-deck-note"></span>
        </div>
      </div>

      <section class="recipe">
        <header class="bar">
          <span id="recipe-title"></span>
          <span id="recipe-counts"></span>
        </header>
        <div class="recipe-cards">
          <div class="recipe-summoner" id="recipe-summoner"></div>
          <div class="recipe-grid" id="recipe-grid"></div>
        </div>
      </section>

      <footer class="ai-footer">
        <button class="menu-button" id="back" data-i18n="common.exit">나가기</button>
        <div class="ai-footer-right">
          <button class="menu-button" id="random-opp" type="button" data-i18n="ai.randomToggle">AI 덱은 해당 난이도의 랜덤 덱</button>
          <button class="menu-button primary" id="next" data-i18n="common.next">다음</button>
        </div>
      </footer>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  </div><!-- /.fhd-stage -->
</div><!-- /.fhd-shell -->

  <script type="module" src="js/ai.js?v=i18n31"></script>
  <script type="module" src="js/presence.js?v=1"></script>
</body>
</html>
