<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/favicon.png?v=3">
  <title data-i18n="app.title">대전 - 키라라 판타지아 카드게임</title>
  <link rel="stylesheet" href="css/style.css?v=w28">
  <link rel="stylesheet" href="css/deck.css?v=48">
  <link rel="stylesheet" href="css/game.css?v=resultScrim1">
</head>
<body class="window-theme window-theme-fill">
  <div id="duel-background" aria-hidden="true"></div>

  <div class="game-page">
    <!-- left: the card under the pointer, then its text / the duel log / chat / settings -->
    <section class="side">
      <img id="preview" class="preview" alt="" src="">
      <div class="tabs">
        <button class="tab active" data-tab="info" data-i18n="game.cardInfo">카드 정보</button>
        <button class="tab" data-tab="log" data-i18n="game.tabLog">기록</button>
        <button class="tab" data-tab="chat" id="tab-chat" data-i18n="game.tabChat">채팅</button>
        <button class="tab" data-tab="settings" data-i18n="game.settings">설정</button>
        <span class="text-size">
          <button class="size-button" id="text-smaller" data-i18n="common.textSizeMinus" data-i18n-title="common.textSmaller" title="글자 작게">가-</button>
          <span id="text-size-value"></span>
          <button class="size-button" id="text-bigger" data-i18n="common.textSizePlus" data-i18n-title="common.textBigger" title="글자 크게">가+</button>
        </span>
      </div>
      <div class="tab-page card-info panel" id="card-info" data-page="info"></div>
      <div class="tab-page panel feed" id="feed" data-page="log" hidden>
        <ol id="duel-log"></ol>
      </div>
      <div class="tab-page panel feed chat" id="chat-feed" data-page="chat" hidden>
        <ol id="duel-chat"></ol>
        <input id="chat-input" class="field" maxlength="120" data-i18n-placeholder="game.chatPlaceholder" placeholder="메시지를 입력하고 Enter">
      </div>
      <div class="tab-page panel settings" data-page="settings" hidden>
        <p data-i18n="game.sound">사운드</p>
        <label class="volume">
          <span data-i18n="common.sfx">효과음</span>
          <input type="range" id="volume-voice" min="0" max="100" step="5">
          <b id="volume-voice-value"></b>
        </label>
        <label class="volume">
          <span data-i18n="common.bgm">배경음</span>
          <input type="range" id="volume-bgm" min="0" max="100" step="5">
          <b id="volume-bgm-value"></b>
        </label>
        <p data-i18n="common.language">언어 설정</p>
        <div class="settings-lang" id="settings-lang" role="group" data-i18n-aria="common.language" aria-label="언어 설정">
          <button type="button" class="settings-lang-btn" data-lang="ko" data-i18n-title="lang.ko" data-i18n-aria="lang.ko" title="한국어" aria-label="한국어">
            <img src="assets/ui/flag-ko.svg" alt="">
          </button>
          <button type="button" class="settings-lang-btn" data-lang="ja" data-i18n-title="lang.ja" data-i18n-aria="lang.ja" title="日本語" aria-label="日本語">
            <img src="assets/ui/flag-jp.svg" alt="">
          </button>
          <button type="button" class="settings-lang-btn" data-lang="en" data-i18n-title="lang.en" data-i18n-aria="lang.en" title="English" aria-label="English">
            <img src="assets/ui/flag-us.svg" alt="">
          </button>
        </div>
      </div>
      <!-- a saved game shown again (game.html?replay=<id>): its controls -->
      <div class="replay-panel panel" id="replay-panel">
        <div class="replay-head">
          <span class="replay-head-title"><b data-i18n="game.replayPanel">리플레이</b> <span id="replay-title"></span></span>
          <button type="button" class="size-button" id="replay-hide" data-i18n="game.replayHide" data-i18n-title="game.replayHide" title="리플레이 창 숨기기">숨기기</button>
        </div>
        <input type="range" id="replay-seek" min="0" max="0" value="0" data-i18n-aria="game.replayPlay" aria-label="재생 위치">
        <div class="replay-row">
          <span id="replay-where"></span>
          <label class="replay-speeds" data-i18n-title="game.replaySpeedTitle" title="배속 (1배속: 행동마다 0.5초)">
            <span data-i18n="game.replaySpeed">배속</span>
            <input type="range" id="replay-speed" min="0.25" max="3" step="0.25" value="1" data-i18n-aria="game.replaySpeed" aria-label="배속">
            <b id="replay-speed-value">1.00x</b>
          </label>
        </div>
        <div class="replay-buttons">
          <button class="size-button" id="replay-first" data-i18n-title="game.replayFirst" title="처음으로">⏮</button>
          <button class="size-button" id="replay-prev" data-i18n-title="game.replayPrev" title="한 행동 뒤로 (←)">⏴</button>
          <button class="size-button" id="replay-reverse" data-i18n="game.replayReverse" data-i18n-title="game.replayReverse" title="역재생">◀ 역재생</button>
          <button class="size-button" id="replay-pause" data-i18n="game.replayPause" data-i18n-title="game.replayPause" title="정지 (스페이스)">⏸ 정지</button>
          <button class="size-button" id="replay-play" data-i18n="game.replayPlay" data-i18n-title="game.replayPlay" title="재생 (스페이스)">▶ 재생</button>
          <button class="size-button" id="replay-next" data-i18n-title="game.replayNext" title="한 행동 앞으로 (→)">⏵</button>
          <button class="size-button" id="replay-last" data-i18n-title="game.replayLast" title="끝으로">⏭</button>
        </div>
      </div>
      <button type="button" class="replay-show size-button" id="replay-show" hidden data-i18n="game.replayShow" data-i18n-title="game.replayShow" title="리플레이 창 표시">리플레이 표시</button>
    </section>

    <!-- right: fixed-ratio field scaled to fit; left column stays fluid -->
    <div class="board-shell">
    <section class="board" id="board">
      <button class="menu-button small surrender" id="surrender" data-i18n="duel.surrender">항복하고 나가기</button>
      <div class="hand op" id="op-hand"></div>
      <div class="side-row op" id="op-row"></div>
      <div class="center-bar">
        <div class="turn-box" id="turn-box"></div>
        <ol class="phases" id="phases"></ol>
        <div class="phase-actions">
          <!-- (the main phase goes on to the battle phase, the battle phase ends the turn) -->
          <button class="menu-button primary" id="phase-button" disabled data-i18n="game.battlePhase">배틀 페이즈</button>
        </div>
      </div>
      <div class="side-row me" id="my-row"></div>
      <div class="hand me" id="my-hand"></div>

      <!-- picking cards: the 4 of the opening 9 that go to the 성전, and later the game's other card choices -->
      <div class="choose panel" id="choose" hidden>
        <header class="bar"><span id="choose-title"></span></header>
        <p class="choose-note" id="choose-note"></p>
        <div class="choose-cards" id="choose-cards"></div>
        <footer class="choose-footer">
          <span id="choose-count"></span>
          <span class="choose-buttons">
            <button class="menu-button" id="choose-cancel" hidden data-i18n="game.cancel">취소</button>
            <button class="menu-button primary" id="choose-ok" disabled></button>
          </span>
        </footer>
      </div>

      <!-- a question: answer a chain, yes / no, a number, the result -->
      <div class="prompt panel" id="prompt" hidden>
        <header class="bar" id="prompt-title"></header>
        <p class="prompt-text" id="prompt-text"></p>
        <div class="prompt-options" id="prompt-options"></div>
      </div>

      <!-- the attack motions over the board: the attacker's weapon, the target's mark -->
      <div class="fx" id="fx" aria-hidden="true"></div>

      <!-- a puzzle's story line: the speaker on the ribbon, the line on the paper, the quill waiting for a click -->
      <div class="story" id="story" hidden>
        <div class="story-name" id="story-name"></div>
        <p class="story-text" id="story-text"></p>
        <img class="story-pen" src="assets/story/pen.png" alt="">
      </div>

      <!-- notices for a moment (an alchemist's effect from the 돗테오키 존), the newest on top -->
      <div class="notices" id="notices"></div>

      <!-- what a clicked card can do now -->
      <div class="card-menu" id="card-menu" hidden></div>

      <!-- picking cards that are on the board or in the hand: they are clicked where they are -->
      <div class="select-bar panel" id="select-bar" hidden>
        <span class="select-title" id="select-title"></span>
        <span class="select-count" id="select-count"></span>
        <span class="choose-buttons">
          <button class="menu-button" id="select-cancel" hidden data-i18n="game.cancel">취소</button>
          <button class="menu-button primary" id="select-ok" disabled data-i18n="game.confirm">확인</button>
        </span>
      </div>
    </section>
    </div><!-- /.board-shell -->
  </div>

  <div class="pile-list panel" id="pile-list" hidden>
    <header class="bar"><span id="pile-list-title"></span><button class="size-button" id="pile-list-close" data-i18n="game.close">닫기</button></header>
    <div class="pile-list-cards" id="pile-list-cards"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- a creamate on its way from a hand to its place (playFlights) -->
  <div class="fly" id="fly" aria-hidden="true"></div>

  <script type="module" src="js/game.js?v=dotteChip1"></script>
  <script type="module" src="js/presence.js?v=1"></script>
</body>
</html>
