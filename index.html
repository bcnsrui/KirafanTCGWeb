<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/favicon.png?v=3">
  <title data-i18n="app.title">키라라 판타지아 카드게임</title>
  <link rel="stylesheet" href="css/style.css?v=w28">
  <script>
    /* 웹: 메인 복귀 시 무결성 화면 깜빡임 방지. exe는 실행마다 검사하므로 숨기지 않음 */
    (function () {
      try {
        var tauri = !!(window.__TAURI__ || window.__TAURI_INTERNALS__);
        if (tauri) return;
        if (sessionStorage.getItem("kirafan-boot-session-ok") === "1"
            || localStorage.getItem("kirafan-boot-done")
            || localStorage.getItem("kirafan-manifest-meta")) {
          document.documentElement.classList.add("boot-skip");
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body class="theme-kirafan">
  <div id="background" aria-hidden="true"></div>
  <div id="petals" aria-hidden="true"></div>

  <div id="boot-overlay" class="hidden" hidden aria-live="polite">
    <div class="boot-art" aria-hidden="true"></div>

    <div class="boot-top">
      <div class="boot-top-main">
        <p id="boot-status" class="boot-status" data-i18n="boot.ready">준비 중…</p>
        <p id="boot-detail" class="boot-detail"></p>
      </div>
      <div class="boot-lang" role="group" data-i18n-aria="common.language" aria-label="언어 설정">
        <button type="button" class="boot-lang-btn" data-lang="ko" data-i18n-title="lang.ko" data-i18n-aria="lang.ko" title="한국어" aria-label="한국어">
          <img src="assets/ui/flag-ko.svg" alt="">
        </button>
        <button type="button" class="boot-lang-btn" data-lang="ja" data-i18n-title="lang.ja" data-i18n-aria="lang.ja" title="日本語" aria-label="日本語">
          <img src="assets/ui/flag-jp.svg" alt="">
        </button>
        <button type="button" class="boot-lang-btn" data-lang="en" data-i18n-title="lang.en" data-i18n-aria="lang.en" title="English" aria-label="English">
          <img src="assets/ui/flag-us.svg" alt="">
        </button>
      </div>
    </div>

    <div id="boot-setup" class="boot-setup" hidden>
      <p id="boot-setup-help" class="boot-help" data-i18n="boot.setupHelp">
        카드·그림·사운드를 받을 폴더를 정합니다. 기본값은 exe가 있는 폴더입니다. 실행할 때마다 이 경로와 깃허브를 비교합니다.
      </p>
      <p class="boot-help"><span data-i18n="boot.defaultPath">기본 위치:</span> <span id="boot-path-suggest"></span></p>
      <div class="boot-actions">
        <button type="button" class="menu-button" id="boot-use-default" data-i18n="boot.useDefault">기본 위치 사용</button>
        <button type="button" class="menu-button" id="boot-pick-folder" data-i18n="boot.pickFolder">폴더 고르기</button>
      </div>
    </div>

    <div id="boot-progress" class="boot-dock">
      <p id="boot-place" class="boot-place" hidden></p>
      <p id="boot-path" class="boot-path" hidden></p>

      <div class="boot-track-wrap">
        <div class="boot-track" aria-hidden="true">
          <span id="boot-bar" class="boot-fill"></span>
          <img id="boot-creature" class="boot-creature" src="assets/boot/creature.png" alt="">
        </div>
        <div class="boot-loading-label" aria-hidden="true">
          <img class="boot-loading-word" src="assets/boot/loading-title.png" alt="Loading">
          <span id="boot-dots" class="boot-dots"></span>
        </div>
      </div>
    </div>
  </div>

  <header class="home-header">
    <div class="home-brand">
      <span class="home-brand-mark" aria-hidden="true"></span>
      <div>
        <p class="home-brand-title" data-i18n="app.brand">키라라 판타지아</p>
        <p class="home-brand-sub"><span data-i18n="app.subtitle">카드게임</span> <span id="version"></span></p>
      </div>
    </div>
    <div class="home-header-actions">
      <a class="kf-discord" href="https://discord.gg/54UfBb5Dcw" target="_blank" rel="noopener noreferrer" data-i18n-title="nav.discord" data-i18n-aria="nav.discord" title="Discord" aria-label="Discord">
        <img src="assets/ui/discord.svg" alt="">
      </a>
      <a id="exe-download" class="kf-exe" href="https://drive.google.com/file/d/1BkiTL3xN3DjB5HfVcJloLyeFLlhKG7BB/view" target="_blank" rel="noopener noreferrer" data-i18n-title="nav.exe" data-i18n-aria="nav.exe" title="Windows 설치" aria-label="Windows 설치">
        <img src="assets/ui/windows-exe.svg" alt="">
      </a>
      <button id="settings-button" class="icon-button kf-settings" type="button" data-i18n-title="common.menu" data-i18n-aria="common.menu" title="메뉴" aria-label="메뉴" aria-expanded="false" aria-controls="settings-panel">
        <img src="assets/ui/MenuButton.png?v=2" alt="">
      </button>
    </div>
  </header>

  <main id="main-menu" class="home-menu booting">
    <div class="home-cards-shell">
      <nav class="home-cards" data-i18n-aria="nav.main" aria-label="메인 메뉴">
        <button class="home-card" data-action="server" type="button">
          <img class="home-card-img" src="assets/home/menu-card-frame.png?v=2" alt="">
          <img class="home-card-icon" src="assets/home/menu-icon-server.png" alt="">
          <span class="home-card-label" data-i18n="nav.server">서버 대전</span>
        </button>
        <button class="home-card" data-action="ai" type="button">
          <img class="home-card-img" src="assets/home/menu-card-frame.png?v=2" alt="">
          <img class="home-card-icon" src="assets/home/menu-icon-ai.png" alt="">
          <span class="home-card-label" data-i18n="nav.ai">AI 대전</span>
        </button>
        <button class="home-card" data-action="story" type="button">
          <img class="home-card-img" src="assets/home/menu-card-frame.png?v=2" alt="">
          <img class="home-card-icon" src="assets/home/menu-icon-story.png" alt="">
          <span class="home-card-label" data-i18n="nav.puzzle">튜토리얼 + 퍼즐</span>
        </button>
        <button class="home-card" data-action="replay" type="button">
          <img class="home-card-img" src="assets/home/menu-card-frame.png?v=2" alt="">
          <img class="home-card-icon" src="assets/home/menu-icon-replay.png" alt="">
          <span class="home-card-label" data-i18n="nav.replay">리플레이 열람</span>
        </button>
        <button class="home-card" data-action="deck" type="button">
          <img class="home-card-img" src="assets/home/menu-card-frame.png?v=2" alt="">
          <img class="home-card-icon" src="assets/home/menu-icon-deck.png" alt="">
          <span class="home-card-label" data-i18n="nav.deck">덱 편집</span>
        </button>
      </nav>
    </div>
  </main>

  <div id="settings-backdrop" class="settings-backdrop" hidden></div>
  <aside id="settings-panel" class="settings-panel" hidden role="dialog" aria-labelledby="settings-title">
    <header class="settings-head">
      <h2 id="settings-title" data-i18n="settings.title">메뉴</h2>
      <button type="button" class="settings-close" id="settings-close" data-i18n-aria="common.close" aria-label="닫기">×</button>
    </header>
    <div class="settings-body">
      <label class="settings-row">
        <span data-i18n="common.nickname">닉네임</span>
        <div class="settings-nick">
          <input class="field" id="settings-nick" type="text" maxlength="20" autocomplete="off">
          <button type="button" class="menu-button small" id="settings-nick-save" data-i18n="common.save">저장</button>
        </div>
      </label>
      <label class="settings-row">
        <span data-i18n="common.sfx">효과음</span>
        <input id="settings-sfx" type="range" min="0" max="100" step="1">
      </label>
      <label class="settings-row">
        <span data-i18n="common.bgm">배경음</span>
        <input id="settings-bgm" type="range" min="0" max="100" step="1">
      </label>
      <div class="settings-row">
        <span data-i18n="common.language">언어 설정</span>
        <div class="settings-lang" id="settings-lang" role="group" data-i18n-aria="common.language" aria-label="언어 설정">
          <button type="button" class="settings-lang-btn" data-lang="ko" data-i18n-title="lang.ko" data-i18n-aria="lang.ko" title="한국어" aria-label="한국어">
            <img src="assets/ui/flag-ko.svg" alt="">
          </button>
          <button type="button" class="settings-lang-btn" data-lang="ja" data-i18n-title="lang.ja" data-i18n-aria="lang.ja" title="日本語" aria-label="日本語">
            <img src="assets/ui/flag-jp.svg" alt="">
          </button>
          <button type="button" class="settings-lang-btn" data-lang="en" data-i18n-title="lang.en" data-i18n-aria="lang.en" title="English" aria-label="English">
            <img src="assets/ui/flag-us.svg" alt="">
          </button>
        </div>
      </div>
    </div>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js?v=webIntegrity6"></script>
</body>
</html>
